# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - dct

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Validate Microsoft Entra application settings
        env:
          AZURE_MICROSOFT_ENTRA_SETTINGS: ${{ secrets.AZURE_MICROSOFT_ENTRA_SETTINGS }}
        run: |
          node <<'NODE'
          const raw = process.env.AZURE_MICROSOFT_ENTRA_SETTINGS ?? '';

          if (raw.trim() === '') {
            console.error('::error title=Missing Microsoft Entra settings::Create the AZURE_MICROSOFT_ENTRA_SETTINGS repository secret before deploying. See docs/microsoft-entra-authentication.md.');
            process.exit(1);
          }

          let settings;

          try {
            settings = JSON.parse(raw);
          } catch {
            console.error('::error title=Invalid Microsoft Entra settings::AZURE_MICROSOFT_ENTRA_SETTINGS must contain valid JSON.');
            process.exit(1);
          }

          if (!Array.isArray(settings)) {
            console.error('::error title=Invalid Microsoft Entra settings::AZURE_MICROSOFT_ENTRA_SETTINGS must contain a JSON array.');
            process.exit(1);
          }

          const values = new Map(settings.map((setting) => [setting.name, String(setting.value ?? '').trim()]));
          const required = [
            'APP_URL',
            'MICROSOFT_ENTRA_ENABLED',
            'MICROSOFT_ENTRA_TENANT',
            'MICROSOFT_ENTRA_CLIENT_ID',
            'MICROSOFT_ENTRA_CLIENT_SECRET',
            'MICROSOFT_ENTRA_REDIRECT_URI',
            'SESSION_SAME_SITE',
          ];
          const missing = required.filter((name) => {
            const value = values.get(name) ?? '';

            return value === '' || /^<.*>$/.test(value);
          });

          if (missing.length > 0) {
            console.error(`::error title=Incomplete Microsoft Entra settings::Missing or placeholder values: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (values.get('MICROSOFT_ENTRA_ENABLED') !== 'true') {
            console.error('::error title=Microsoft Entra disabled::MICROSOFT_ENTRA_ENABLED must be true.');
            process.exit(1);
          }

          if (values.get('MICROSOFT_ENTRA_REDIRECT_URI') !== 'https://af-aho-dct-f8hnfwbcb4e6c0bg.westeurope-01.azurewebsites.net/microsoft_authentication/callback') {
            console.error('::error title=Invalid Microsoft Entra callback::The production redirect URI must match the documented callback URL.');
            process.exit(1);
          }
          NODE

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D785D1A9B36B46ECABBABEEA04C3A962 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E9E74FA156494D14AE18B101ED7A0354 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5542F71BFC994D25A0D6FDE2B8DE63CC }}

      - name: Configure Microsoft Entra on Azure App Service
        uses: azure/appservice-settings@v1
        with:
          app-name: 'af-aho-dct'
          app-settings-json: '${{ secrets.AZURE_MICROSOFT_ENTRA_SETTINGS }}'

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'af-aho-dct'
          slot-name: 'Production'
          package: .
          startup-command: 'bash /home/site/wwwroot/startup.sh'
          
