# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - dct

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Install production PHP dependencies
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          rm -rf node_modules


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE7AB5520DA540D08231F81A4B669B24 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_13CB29A0066A46A8BAB5E4FC56612E99 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9AD8DB53E08A40DFB86B56F0C993A337 }}

      - name: Apply Azure App Service settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'dct'
          # AZURE_MICROSOFT_ENTRA_SETTINGS must include MICROSOFT_ENTRA_REDIRECT_URI and the other Microsoft Entra app settings.
          app-settings-json: ${{ secrets.AZURE_MICROSOFT_ENTRA_SETTINGS }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'dct'
          slot-name: 'Production'
          package: .
          startup-command: 'bash /home/site/wwwroot/startup.sh'
          
